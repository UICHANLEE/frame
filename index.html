<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0c0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>영뽀또 감성 구도 카메라</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="camera-app" aria-label="영뽀또 감성 구도 카메라">
      <section class="viewfinder" aria-label="실시간 카메라">
        <video id="cameraVideo" autoplay muted playsinline></video>
        <canvas id="sourceCanvas" width="1440" height="1920" hidden></canvas>
        <canvas id="outputCanvas" width="1440" height="1920"></canvas>

        <div class="ambient ambient-top"></div>
        <div class="ambient ambient-bottom"></div>

        <header class="top-hud">
          <button class="glass-button" id="openPhotoButton" type="button">사진</button>
          <div class="brand-lockup">
            <strong>영뽀또</strong>
            <span id="activeSummary">감성 필터 · 삼분할</span>
          </div>
          <button class="glass-button" id="switchCameraButton" type="button">전환</button>
        </header>

        <section class="guide-copy" aria-live="polite">
          <span id="guideName">삼분할 구도</span>
          <p id="guideTip">피사체를 교차점에 두면 시선이 자연스럽게 이동합니다.</p>
        </section>

        <section class="permission-card" id="permissionCard">
          <p class="eyebrow">YOUNG PPOTTO CAMERA</p>
          <h1>감성 사진을 바로 잡는 구도 카메라</h1>
          <p>
            구도 가이드와 색감 필터를 실시간으로 보면서 촬영하세요.
            iPhone/Android 브라우저에서는 HTTPS 환경에서 카메라가 작동합니다.
          </p>
          <div class="permission-actions">
            <button id="startCameraButton" class="primary-action" type="button">카메라 시작</button>
            <button id="sampleSceneButton" class="secondary-action" type="button">샘플로 보기</button>
          </div>
        </section>

        <input id="photoInput" type="file" accept="image/*" capture="environment" hidden />
      </section>

      <section class="bottom-sheet" aria-label="촬영 도구">
        <nav class="tool-tabs" aria-label="도구 탭">
          <button class="is-active" type="button" data-tab="guides">구도</button>
          <button type="button" data-tab="filters">필터</button>
          <button type="button" data-tab="lessons">강의</button>
          <button type="button" data-tab="edits">보정</button>
        </nav>

        <section class="tool-panel" data-panel="guides">
          <div class="horizontal-picker" id="guidePicker"></div>
        </section>

        <section class="tool-panel is-hidden" data-panel="filters">
          <div class="horizontal-picker" id="filterPicker"></div>
        </section>

        <section class="tool-panel is-hidden" data-panel="lessons">
          <div class="lesson-stack" id="lessonStack"></div>
        </section>

        <section class="tool-panel is-hidden" data-panel="edits">
          <label class="slider-row">
            <span>필터 세기</span>
            <input id="filterStrength" type="range" min="0" max="100" value="78" />
          </label>
          <label class="slider-row">
            <span>필름 그레인</span>
            <input id="grainStrength" type="range" min="0" max="40" value="10" />
          </label>
          <label class="slider-row">
            <span>비네팅</span>
            <input id="vignetteStrength" type="range" min="0" max="70" value="24" />
          </label>
        </section>
      </section>

      <footer class="capture-dock" aria-label="촬영 조작">
        <button class="mini-preview" id="lastShotButton" type="button" aria-label="최근 촬영 사진"></button>
        <button class="shutter" id="captureButton" type="button" aria-label="촬영"></button>
        <button class="save-button" id="saveButton" type="button" disabled>저장</button>
      </footer>

      <section class="toast" id="toast" role="status" aria-live="polite"></section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
